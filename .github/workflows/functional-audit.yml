name: Functional audit
on:
  pull_request:
    branches: [stabilization/production-readiness]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: functional-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  functional-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        spec: [booking-audit, public-flows, internal-links-audit, functional-audit-negative, reviews-resilience-audit, server-routing-audit, inspiration-navigation, client-reschedule]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: node scripts/install-dependencies.mjs
      - run: command -v google-chrome && google-chrome --version
      - name: Run audit acceptance and regression tests
        run: pnpm test:e2e --project=desktop --project=mobile-390 tests/e2e/${{ matrix.spec }}.spec.ts --reporter=list,json
        env:
          MATA_E2E_COLLABORATOR_ACCESS_ENABLED: 'true'
          MATA_PLAYWRIGHT_CHROMIUM_PATH: /usr/bin/google-chrome
          PLAYWRIGHT_JSON_OUTPUT_NAME: outputs/functional-results.json
      - name: Retain audit results including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: functional-audit-${{ matrix.spec }}-results
          path: |
            outputs/functional-results.json
            test-results/
          retention-days: 7
          if-no-files-found: warn
