name: Functional audit
on:
  pull_request:
    branches: [stabilization/production-readiness]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: functional-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  functional-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: command -v google-chrome && google-chrome --version
      - name: Run audit acceptance and regression tests
        run: pnpm test:e2e --project=desktop --project=mobile-390 tests/e2e/functional-audit-negative.spec.ts tests/e2e/internal-links-audit.spec.ts tests/e2e/reviews-resilience-audit.spec.ts tests/e2e/server-routing-audit.spec.ts tests/e2e/booking-audit.spec.ts tests/e2e/public-flows.spec.ts
        env:
          MATA_E2E_COLLABORATOR_ACCESS_ENABLED: 'true'
          MATA_PLAYWRIGHT_CHROMIUM_PATH: /usr/bin/google-chrome
