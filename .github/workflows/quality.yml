name: Mata quality
on:
  push:
    branches: [main, stabilization/production-readiness]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mata-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/quality-gate.mjs
  browser-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      # Ubuntu runners already include Chrome. Verify it explicitly rather than
      # waiting on apt/browser downloads before the regression tests can start.
      - run: command -v google-chrome && google-chrome --version
      - run: pnpm test:e2e --project=desktop --project=mobile-390 tests/e2e/staff-audit.spec.ts tests/e2e/client-finance-audit.spec.ts tests/e2e/salon-pro-audit.spec.ts tests/e2e/workspace-inventory.spec.ts tests/e2e/csp-workspaces.spec.ts tests/e2e/messages-logo-phone.spec.ts tests/e2e/review-stars.spec.ts
        env:
          MATA_E2E_COLLABORATOR_ACCESS_ENABLED: 'true'
          MATA_PLAYWRIGHT_CHROMIUM_PATH: /usr/bin/google-chrome
  studio-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      # Ubuntu runners already include Chrome. Verify it explicitly rather than
      # waiting on apt/browser downloads before the regression tests can start.
      - run: command -v google-chrome && google-chrome --version
      - run: pnpm test:e2e --project=desktop --project=mobile-390 tests/e2e/studio-publishing.spec.ts
        env:
          MATA_E2E_COLLABORATOR_ACCESS_ENABLED: 'true'
          MATA_PLAYWRIGHT_CHROMIUM_PATH: /usr/bin/google-chrome

  studio-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:e2e --project=mobile-webkit tests/e2e/studio-publishing.spec.ts --grep "video (mov|mp4|avi|mkv),"
        env:
          MATA_E2E_COLLABORATOR_ACCESS_ENABLED: 'true'
